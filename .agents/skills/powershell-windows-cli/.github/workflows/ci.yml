name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate skill format
        run: |
          python scripts/validate_ps.py -c "Get-Service | Where-Object { \$_.Status -eq 'Stopped' }"
          python scripts/generate_template.py --list
          python scripts/generate_template.py list-services --status Stopped --start-type Automatic
          python scripts/generate_template.py query-events --log System --level Error --hours 24 --json

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check scripts/
